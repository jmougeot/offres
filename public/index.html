<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offres — Collecte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a class="brand" href="/"><span class="logo">O</span>Offres</a></nav>
<div class="layout">
<aside class="sidebar">
  <!-- Collecte -->
  <section class="side-section">
    <div class="side-head"><h2>Collecter</h2></div>
    <button onclick="collect()" id="collectBtn" class="block">Collecter les offres</button>
    <label class="check" id="discoverWrap"
      title="Cherche de nouvelles pages carrières via l'API de recherche (requêtes site:…). Seules les pages pas encore en cache consomment des crédits.">
      <input type="checkbox" id="fDiscover"> Découvrir de nouvelles entreprises
    </label>
    <div class="inline sub-opt" id="budgetWrap" hidden>
      <span class="muted">jusqu'à</span>
      <input id="fBudget" type="number" value="60" min="1" max="500" style="width:72px">
      <span class="muted">requêtes payées</span>
    </div>
    <label class="check"
      title="Lit les job boards d'une trentaine de fonds (nouvelles startups à suivre), Welcome to the Jungle et deux agrégateurs. Gratuit, mais la collecte dure quelques minutes de plus.">
      <input type="checkbox" id="fExtras" checked> Fonds, Welcome to the Jungle et agrégateurs
    </label>
    <label class="check"
      title="Lit la recherche d'offres publique de LinkedIn, sans compte ni cookie (60 pages au plus, offres des 3 derniers jours). Source non officielle : beaucoup d'ESN et de cabinets, pas de texte d'offre.">
      <input type="checkbox" id="fLinkedin"> LinkedIn public
    </label>
    <label class="check"
      title="Visite les sites des entreprises tech de la base Enrichissement et de ceux ajoutés à la main, les plus anciennement vus d'abord. L'ATS trouvé est suivi ; sinon la page carrières est lue par des sessions Claude Code (abonnement, sans clé d'API).">
      <input type="checkbox" id="fSites"> Sites des entreprises
    </label>
    <div class="inline sub-opt" id="sitesWrap" hidden>
      <input id="fSitesLimit" type="number" value="150" min="1" max="3000" style="width:72px">
      <span class="muted" id="sitesHint">sites par collecte</span>
    </div>

    <details class="adv">
      <summary>Ajouter des pages carrières à la main</summary>
      <textarea id="fRefs" rows="3" placeholder="qonto.com
https://jobs.lever.co/mistral
greenhouse:algolia"></textarea>
      <button class="ghost block" onclick="addBoards()">Ajouter</button>
    </details>
  </section>

  <!-- Filtres -->
  <section class="side-section" id="filters">
  <div class="side-head">
    <h2>Filtres</h2>
    <button class="linkbtn" id="resetBtn" onclick="resetFilters()" hidden>Réinitialiser</button>
  </div>

  <div class="fgroup">
    <h3>Offre</h3>
    <label class="field-label" for="lQ">Recherche</label>
    <input id="lQ" type="search" placeholder="Poste, entreprise, ville…">
    <label class="field-label" for="lCategory">Catégorie</label>
    <select id="lCategory">
      <option value="">Toutes catégories</option>
      <option value="dev">Dev</option>
      <option value="data_ml">Data / ML</option>
      <option value="devops">Devops</option>
    </select>
    <label class="field-label" for="lStatus">Statut</label>
    <select id="lStatus">
      <option value="open">En ligne</option>
      <option value="closed">Fermées</option>
      <option value="all">Toutes</option>
    </select>
    <label class="field-label" for="lMinDays">En ligne depuis au moins</label>
    <div class="unit"><input id="lMinDays" type="number" min="0" placeholder="0"><span class="muted">jours</span></div>
  </div>

  <div class="fgroup">
    <h3>Entreprise</h3>
    <label class="field-label" for="lMinSize" title="Effectif connu de l'entreprise. Dès qu'une borne est saisie, les entreprises de taille inconnue sont écartées.">Nombre de personnes</label>
    <div class="range">
      <input id="lMinSize" type="number" min="0" placeholder="Min">
      <span class="muted">à</span>
      <input id="lMaxSize" type="number" min="0" placeholder="Max" aria-label="Nombre de personnes maximum">
    </div>
    <label class="field-label" for="lMinOpen">Offres tech en ligne, au moins</label>
    <div class="unit"><input id="lMinOpen" type="number" min="0" placeholder="0"><span class="muted">offres</span></div>
    <label class="check" title="Écarte les sociétés de conseil, ESN, agences et cabinets de recrutement : entreprises classées ou signalées comme telles, et annonces qui en ont l'air">
      <input type="checkbox" id="lHideAgency" checked> Masquer conseil, ESN, agences et cabinets
    </label>
    <label class="check" title="Écarte les offres dont l'intitulé annonce une alternance ou un apprentissage, et celles des écoles et organismes d'alternance">
      <input type="checkbox" id="lHideAlternance" checked> Masquer alternances et écoles
    </label>
  </div>
  </section>
</aside>

<div class="wrap">
  <div class="page-head">
    <h1>Offres tech en France</h1>
    <span id="metaBadge"></span>
  </div>

  <!-- Offres -->
  <div class="card tablecard">
    <div class="cardhead">
      <div class="inline"><h2 style="margin:0">Entreprises</h2><span class="count" id="count"></span></div>
      <button class="ghost" onclick="exportCsv()">⬇ Exporter en CSV</button>
    </div>
    <div id="jobProgress" hidden style="padding:14px 20px 0">
      <div class="bar"><div id="jobBar" style="width:0%"></div></div>
      <div class="inline" style="margin-top:8px">
        <span class="muted" id="jobLabel"></span>
        <button class="ghost" id="stopBtn" onclick="stopCollect()" hidden>Arrêter</button>
      </div>
    </div>
    <div class="tablescroll">
    <table>
      <thead><tr>
        <th style="width:36px"><input type="checkbox" id="ckAll" onchange="toggleAll(this.checked)"></th>
        <th>Entreprise</th>
        <th title="Décideur tech de l'entreprise (CTO, VP / Head of Engineering, fondateur) trouvé sur LinkedIn">Contact</th>
        <th title="La plus récente des offres de l'entreprise retenues par les filtres">Offre la plus récente</th>
        <th>Localisation</th>
        <th title="Jours écoulés depuis la publication de cette offre ; en dessous, dernière modification de sa page quand elle a été retouchée depuis">Publiée</th>
        <th title="Offres de l'entreprise retenues par les filtres ; toutes sont dans sa fiche">Offres</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
  </div>
</div>
</div>

<div class="drawer-back" id="coBack" hidden onclick="closeCompany()"></div>
<aside class="drawer" id="coDrawer" hidden></aside>

<script>
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => [...(root || document).querySelectorAll(s)];

async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

/** Notification éphémère en bas de l'écran (feedback d'action sans bloquer). */
function notify(msg, ok = true) {
  const t = document.createElement("div");
  t.className = "toast" + (ok ? "" : " bad");
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 4000);
}

const CATEGORIES = { dev: "Dev", data_ml: "Data / ML", devops: "Devops" };
let running = false;

async function loadMeta() {
  const meta = await api("/api/meta");
  $("#metaBadge").innerHTML =
    `<span class="pill ${meta.boards ? "replied" : "held"}">${meta.boards} page(s) carrières suivie(s) · ${meta.open_jobs} offre(s) en ligne</span>`;
  // sans clé de recherche, la découverte est indisponible (la collecte reste possible)
  $("#fDiscover").disabled = !meta.search_api;
  if (meta.sites) $("#sitesHint").textContent = `sites par collecte (${meta.sites_seen}/${meta.sites} déjà visités)`;
  if (!meta.search_api) $("#discoverWrap").title = "Configurez SERPER_API_KEY dans .env pour activer la découverte.";
  return meta;
}

async function init() {
  // tout changement dans le panneau de filtres relance la liste (saisie temporisée)
  let filterTimer;
  $("#filters").addEventListener("input", () => { clearTimeout(filterTimer); filterTimer = setTimeout(loadCompanies, 250); });
  $("#fDiscover").addEventListener("change", (e) => ($("#budgetWrap").hidden = !e.target.checked));
  $("#fSites").addEventListener("change", (e) => ($("#sitesWrap").hidden = !e.target.checked));
  const meta = await loadMeta();
  // première utilisation : rien à relire, la découverte est le point de départ
  if (!meta.boards && meta.search_api) { $("#fDiscover").checked = true; $("#budgetWrap").hidden = false; }
  // un job tournait déjà (page rechargée) : on raccroche le suivi
  const s = await api("/api/status").catch(() => null);
  if (s && s.running) trackJob();
  loadCompanies();
}

async function collect() {
  $("#collectBtn").disabled = true;
  try {
    await api("/api/collect", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ discover: $("#fDiscover").checked, budget: +$("#fBudget").value || 60, extras: $("#fExtras").checked, linkedin: $("#fLinkedin").checked,
        sites: $("#fSites").checked, sites_limit: +$("#fSitesLimit").value || 150 }),
    });
    trackJob();
  } catch (e) {
    notify(e.message, false);
    $("#collectBtn").disabled = false;
  }
}

async function stopCollect() {
  $("#stopBtn").disabled = true;
  try {
    await api("/api/stop", { method: "POST" });
    notify("Arrêt demandé — la collecte s'interrompt.");
  } catch (e) {
    notify(e.message, false);
  }
}

async function addBoards() {
  notify("Recherche des pages carrières…");
  try {
    const r = await api("/api/boards", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ refs: $("#fRefs").value }),
    });
    if (r.added || r.known || r.sites) $("#fRefs").value = r.invalid.join("\n");
    const parts = [`${r.added} page(s) ajoutée(s)`];
    if (r.known) parts.push(`${r.known} déjà suivie(s)`);
    if (r.sites) parts.push(`${r.sites} site(s) sans ATS reconnu, suivi(s) directement (cochez « Sites des entreprises »)`);
    if (r.invalid.length) parts.push(`${r.invalid.length} non reconnue(s)`);
    notify(parts.join(" · ") + (r.added ? " — lancez une collecte pour lire leurs offres." : ""), !r.invalid.length);
    loadMeta();
  } catch (e) {
    notify(e.message, false);
  }
}

function setRunning(on) {
  running = on;
  $("#collectBtn").disabled = on;
  $("#stopBtn").hidden = !on;
  $("#stopBtn").disabled = false;
}

/* Suit le job en cours : barre, libellé, offres affichées au fil de l'eau. */
function trackJob() {
  setRunning(true);
  $("#jobProgress").hidden = false;
  let lastDone = -1;
  const poll = setInterval(async () => {
    const s = await api("/api/status").catch(() => null);
    if (!s) return;
    const pct = s.phase === "collect" && s.total ? Math.round((s.done / s.total) * 100) : 0;
    $("#jobBar").style.width = pct + "%";
    const PHASES = { discover: "Découverte", portfolio: "Job boards des fonds", sites: "Sites des entreprises", feeds: "Autres sources", dates: "Dates de publication" };
    $("#jobLabel").textContent = s.phase === "collect"
      ? `${s.done}/${s.total} page(s) lue(s) · ${s.open_jobs} offre(s) dont ${s.new_jobs} nouvelle(s)` + (s.current ? ` — ${s.current}` : "")
      : `${PHASES[s.phase] || "Collecte"} — ${s.new_boards} nouvelle(s) page(s) carrières` + (s.current ? ` · ${s.current}` : "");
    if (s.done + s.open_jobs !== lastDone) { lastDone = s.done + s.open_jobs; loadCompanies(); }
    if (!s.running) {
      clearInterval(poll);
      setRunning(false);
      setTimeout(() => ($("#jobProgress").hidden = true), 5000);
      const summary = `${s.done} page(s) lue(s), ${s.open_jobs} offre(s) en ligne dont ${s.new_jobs} nouvelle(s)` +
        (s.new_boards ? `, ${s.new_boards} page(s) découverte(s)` : "");
      if (s.errors.length) notify(`Terminé avec ${s.errors.length} erreur(s) : ${s.errors[0]}`, false);
      else notify(`Collecte terminée : ${summary}.`);
      loadMeta();
      loadCompanies();
    }
  }, 1500);
}

let companies = [];
function jobParams() {
  const params = new URLSearchParams();
  params.set("status", $("#lStatus").value);
  if ($("#lCategory").value) params.set("category", $("#lCategory").value);
  if ($("#lQ").value.trim()) params.set("q", $("#lQ").value.trim());
  if (+$("#lMinDays").value > 0) params.set("min_days", $("#lMinDays").value);
  if (+$("#lMinOpen").value > 0) params.set("min_open", $("#lMinOpen").value);
  if ($("#lMinSize").value !== "" && +$("#lMinSize").value >= 0) params.set("min_size", $("#lMinSize").value);
  if ($("#lMaxSize").value !== "" && +$("#lMaxSize").value >= 0) params.set("max_size", $("#lMaxSize").value);
  if ($("#lHideAgency").checked) params.set("hide_agency", "1");
  if ($("#lHideAlternance").checked) params.set("hide_alternance", "1");
  return params;
}

/** Décideur tech de l'entreprise : nom lié au profil LinkedIn, poste, et alerte si le rattachement est incertain ; en dessous, le second contact s'il y en a un. */
function contactCell(j) {
  const second = j.contact2_linkedin
    ? `<div class="cell-sub">+ <a class="lk" href="${esc(j.contact2_linkedin)}" target="_blank" rel="noopener">${esc([j.contact2_first_name, j.contact2_last_name].filter(Boolean).join(" ") || "Profil LinkedIn")}</a>${j.contact2_role ? ` · ${esc(j.contact2_role)}` : ""}</div>`
    : "";
  if (!j.contact_linkedin) return second || '<span class="muted">—</span>';
  const name = [j.contact_first_name, j.contact_last_name].filter(Boolean).join(" ") || "Profil LinkedIn";
  const unsure = j.contact_confidence === "haute" ? "" : ` <span class="pill held" title="${esc(j.contact_reason)}">à vérifier</span>`;
  return `<a class="lk" href="${esc(j.contact_linkedin)}" target="_blank" rel="noopener" title="${esc(j.contact_reason)}">${esc(name)}</a>${unsure}` +
    (j.contact_role ? `<div class="cell-sub">${esc(j.contact_role)}</div>` : "") + second;
}

/** Le filtre est-il dans son état initial ? */
const pristine = (el) => (el.type === "checkbox" ? el.checked === el.defaultChecked : el.tagName === "SELECT" ? el.selectedIndex === 0 : el.value === "");

/** Remet le panneau de filtres dans son état initial (offres en ligne, conseil / ESN et alternances masqués, sans autre critère). */
function resetFilters() {
  $$("#filters input, #filters select").forEach((el) => {
    if (el.type === "checkbox") el.checked = el.defaultChecked;
    else if (el.tagName === "SELECT") el.selectedIndex = 0;
    else el.value = "";
  });
  loadCompanies();
}

/** Ancienneté d'une offre : exacte si sa date de publication est connue, minimale si seule une modification de sa page l'est. */
function ageLabel(j) {
  if (j.posted_at != null) return `${j.days_open} j`;
  if (j.modified_at != null) return `<span title="Date de publication inconnue : la page de l'offre n'a pas été modifiée depuis ${j.days_open} j">${j.days_open} j+</span>`;
  return `<span class="muted" title="La page de l'offre ne donne aucune date. Offre vue pour la première fois il y a ${j.days_open} j.">date inconnue</span>`;
}

let loadSeq = 0;
/* Tableau : une ligne par entreprise, celle dont l'offre est la plus récente en premier. */
async function loadCompanies() {
  const params = jobParams();
  $("#resetBtn").hidden = $$("#filters input, #filters select").every(pristine);
  const seq = ++loadSeq;
  const rows = await api("/api/companies?" + params);
  if (seq !== loadSeq) return; // une saisie plus récente a déjà relancé la liste
  companies = rows;
  const emptyMsg = running
    ? "Collecte en cours… les entreprises apparaissent ici au fur et à mesure."
    : "Aucune offre — lancez une collecte ci-dessus.";
  // « sur N » : l'entreprise a d'autres offres en ligne, écartées par les filtres
  const others = (c) => (params.get("status") === "open" && c.company_open > c.offers ? ` <span class="muted">sur ${c.company_open}</span>` : "");
  $("#rows").innerHTML = companies.map((c) => `<tr>
      <td><input type="checkbox" class="ck" value="${esc(c.company_key)}"></td>
      <td><button class="co" onclick="openCompany('${esc(c.company_key)}')" title="Voir la fiche de l'entreprise et toutes ses offres">${esc(c.company)}</button>${c.agency ? ' <span class="pill held" title="Annonce probablement publiée par un cabinet de recrutement ou une ESN">cabinet / ESN ?</span>' : ""}${c.headcount != null ? `<div class="cell-sub">${c.headcount.toLocaleString("fr-FR")} pers.</div>` : ""}</td>
      <td>${contactCell(c)}</td>
      <td><a class="lk" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)} ↗</a><div class="cell-sub">${esc(CATEGORIES[c.category] || c.category)} · via ${esc(c.ats)}</div></td>
      <td>${esc(c.location || "—")}${c.remote ? ' <span class="muted">· télétravail</span>' : ""}</td>
      <td>${ageLabel(c)}${c.closed_at ? ' <span class="muted">(fermée)</span>' : ""}${c.days_modified != null ? `<div class="cell-sub">modifiée il y a ${c.days_modified} j</div>` : ""}</td>
      <td>${c.offers}${others(c)}</td>
    </tr>`).join("") || `<tr><td colspan="7"><div class="empty">${emptyMsg}</div></td></tr>`;
  const offers = companies.reduce((n, c) => n + c.offers, 0);
  $("#count").textContent = companies.length ? `${companies.length} entreprise(s) · ${offers} offre(s)` : "";
}

const COMPANY_TYPES = { produit: "Éditeur / startup produit", conseil_esn_agence: "Conseil, ESN ou agence", cabinet_recrutement: "Cabinet de recrutement", ecole: "École", autre: "Autre" };
const COMPANY_FLAGS = { ecole: "École", conseil_ou_cabinet: "Conseil ou cabinet", pas_une_entreprise: "Pas une entreprise" };
const SIZE_SOURCES = { wttj: "Welcome to the Jungle", enrichissement: "LinkedIn", recherche: "recherche web", estimation: "estimation" };

/* Fiche d'une entreprise : ce qu'on sait d'elle, son contact et ses offres en ligne. Les lignes vides sont omises. */
async function openCompany(key) {
  let c;
  try { c = await api("/api/company?key=" + encodeURIComponent(key)); } catch (e) { return notify(e.message, false); }
  const link = (url, label) => `<a class="lk" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
  const rows = (pairs) => pairs.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  const e = c.enriched || {};
  const domain = e.domain || (c.site && c.site.domain);
  const info = rows([
    ["Effectif", c.size && `${c.size.headcount} personnes <span class="muted">· ${esc(SIZE_SOURCES[c.size.source] || c.size.source)}</span>`],
    ["Nature", c.type && esc(COMPANY_TYPES[c.type.type] || c.type.type) + (c.type.reason ? `<div class="cell-sub">${esc(c.type.reason)}</div>` : "")],
    ["Signalement", c.flag && esc(COMPANY_FLAGS[c.flag] || c.flag)],
    ["Secteur", esc(e.industry)],
    ["Création", e.year_founded],
    ["Localisation", esc(e.location)],
    ["Chiffre d'affaires", e.ca && Number(e.ca).toLocaleString("fr-FR") + " €"],
    ["SIREN", esc(e.siren)],
    ["Site", domain && link("https://" + domain, domain)],
    ["Page carrières", c.site && c.site.careers_url && link(c.site.careers_url, "Ouvrir")],
    ["Sources", esc(c.sources.join(", "))],
  ]);
  const person = (p) => `<dl>${rows([
      ["Nom", link(p.linkedin, [p.first_name, p.last_name].filter(Boolean).join(" ") || "Profil LinkedIn")],
      ["Poste", esc(p.role)],
      ["Confiance", esc(p.confidence) + (p.reason ? `<div class="cell-sub">${esc(p.reason)}</div>` : "")],
    ])}</dl>`;
  const k = c.contact;
  const k2 = c.contact2;
  const contact = !k ? '<span class="muted">Pas encore cherché.</span>'
    : !k.linkedin ? `<span class="muted">Aucun décideur tech trouvé.${k.reason ? " " + esc(k.reason) : ""}</span>`
    : person(k);
  const jobsHtml = c.jobs.map((j) => `<div class="job">
      <a class="lk" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
      <div class="cell-sub">${esc(CATEGORIES[j.category] || j.category)} · ${esc(j.location || "lieu non précisé")}${j.remote ? " · télétravail" : ""} · en ligne depuis : ${ageLabel(j)}${j.days_modified != null ? ` · modifiée il y a ${j.days_modified} j` : ""}</div>
    </div>`).join("") || '<span class="muted">Aucune offre en ligne.</span>';
  $("#coDrawer").innerHTML = `
    <div class="drawer-head"><h2>${esc(c.name)}</h2><button class="ghost" onclick="closeCompany()">Fermer</button></div>
    <div class="muted">${c.jobs.length} offre(s) tech en ligne${c.closed_jobs ? ` · ${c.closed_jobs} fermée(s)` : ""}</div>
    <h3>Entreprise</h3>${info ? `<dl>${info}</dl>` : '<span class="muted">Aucune information.</span>'}
    <h3>Contact</h3>${contact}
    ${k2 ? `<h3>Second contact</h3>${person(k2)}` : ""}
    <div class="inline" style="margin-top:10px">
      <input id="coLinkedin" type="url" placeholder="https://www.linkedin.com/in/…" style="flex:1; min-width:0" onkeydown="if (event.key === 'Enter') saveContact('${esc(c.key)}')">
      <button class="ghost" onclick="saveContact('${esc(c.key)}')">${k && k.linkedin ? "Remplacer" : "Ajouter"}</button>
      ${k && k.linkedin ? `<button class="ghost" onclick="saveContact('${esc(c.key)}', true)" title="Garde le contact actuel et ajoute ce profil à côté">${k2 ? "Remplacer le 2ᵉ" : "Ajouter en 2ᵉ"}</button>` : ""}
    </div>
    <h3>Offres en ligne</h3>${jobsHtml}`;
  $("#coDrawer").hidden = $("#coBack").hidden = false;
  $("#coDrawer").scrollTop = 0;
}

/** Enregistre comme contact de l'entreprise (ou comme second contact) le profil LinkedIn collé dans sa fiche, puis rafraîchit la fiche et le tableau. */
async function saveContact(key, second = false) {
  const linkedin = $("#coLinkedin").value.trim();
  if (!linkedin) return notify("Collez l'URL du profil LinkedIn.", false);
  try {
    const k = await api("/api/contact", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key, linkedin, second }) });
    notify(`Contact enregistré : ${[k.first_name, k.last_name].filter(Boolean).join(" ") || "profil LinkedIn"}`);
    await openCompany(key);
    loadCompanies();
  } catch (e) {
    notify(e.message, false);
  }
}

function closeCompany() {
  $("#coDrawer").hidden = $("#coBack").hidden = true;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCompany(); });

function toggleAll(checked) {
  $$(".ck").forEach((c) => (c.checked = checked));
}

function exportCsv() {
  const params = jobParams();
  const keys = $$(".ck:checked").map((c) => c.value);
  // tout cocher revient à ne rien cocher : les filtres désignent déjà ces entreprises
  if (keys.length && keys.length < companies.length) params.set("keys", keys.join(","));
  if (!companies.length) return notify("Rien à exporter.", false);
  window.location.href = "/api/companies.csv?" + params;
}

init();
</script>
</body>
</html>
